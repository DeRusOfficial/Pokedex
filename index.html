<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/variables/variables.css">
    <link rel="stylesheet" href="./assets/fonts/_montserrat.css">
    <link rel="stylesheet" href="./assets/fonts/_silkscreen.css">
    <link rel="stylesheet" href="./styles/header/header.css">
    <link rel="stylesheet" href="./styles/main/main.css">
    <link rel="stylesheet" href="./styles/dialog/dialog.css">
    <link rel="stylesheet" href="./styles/overlay/overlay.css">
    <link rel="stylesheet" href="./styles/styles.css">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/logo/logo.png">
    <title>Pokedex</title>
</head>

<body onload="init()">
    <header class="menu">
        <div class="menu__logo">
            <div class="menu__logo_img">
                <img src="./assets/icons/favicon/favicon-32x32.png" alt="Pokedex">
            </div>
            <h1 class="menu__logo_text font-silkscreen">Pokedex</h1>
        </div>
        <div class="menu__search">
            <input class="font-montserrat" data-id="search-input" id="searchInput" type="text" placeholder="Enter minimum 3 characters..." class="menu__search_input" oninput="searchPkm()">
        </div>
    </header>

    <main data-id="content" class="content">

    </main>

    <button aria-label="Load more pokemons" data-id="load-more-button" id="load-more-button" onclick="loadMorePkm()">Load more Pokemons</button>

    <dialog data-id="dialog" id="pkmDialog" aria-labelledby="pkmName" onclick="closeDialog()"> </dialog>

    <div id="loadingOverlay" aria-modal="loading-overlay">
        <div id="loadingSpinner" role="status" aria-live="assertive">
            <div class="dots">
                <div class="circle"></div>
            </div>
        </div>
        <p>Loading pokemons ...</p>
    </div>

</body>
    <script src="./js/template.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/features.js"></script>
    <script src="./js/getInfos.js"></script>
</html>
